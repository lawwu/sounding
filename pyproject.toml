[project]
name = "sounding"
version = "0.2.0"
description = "Take a sounding before you dive: a cost-aware BigQuery metadata catalog for people and agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
  "google-cloud-bigquery>=3.25",
  "duckdb>=1.1",
  "pyarrow>=17",
  "mcp>=2",
  "filelock>=3.16",
  "pytz>=2024.1",  # DuckDB's Python TIMESTAMPTZ decoder
]

[project.scripts]
sounding = "sounding.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
