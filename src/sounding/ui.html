<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="sounding-token" content="__SOUNDING_TOKEN__">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sounding</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f21; --muted: #6b6f76; --line: #e3e3df;
    --accent: #1f6feb; --accent-soft: #e8f0fe; --free: #1a7f37; --free-soft: #e6f4ea;
    --warn: #9a6700; --warn-soft: #fff4d6; --bad: #cf222e; --bar: #9bb8f0;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --panel: #1a1d20; --ink: #e6e6e3; --muted: #9a9ea6; --line: #2c3035;
      --accent: #6ea8ff; --accent-soft: #1d2a3f; --free: #5cc27a; --free-soft: #16301f;
      --warn: #e3b341; --warn-soft: #3a2e10; --bad: #ff7b72; --bar: #3d5f99;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line);
           background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  header h1 span { color: var(--muted); font-weight: 400; margin-left: 6px; }
  #stats { color: var(--muted); font-size: 12px; margin-left: auto; }
  #q { flex: 1 1 320px; max-width: 560px; padding: 8px 12px; font-size: 15px; border: 1px solid var(--line);
       border-radius: 8px; background: var(--bg); color: var(--ink); outline: none; }
  #q:focus { border-color: var(--accent); }
  main { flex: 1; display: grid; grid-template-columns: 240px minmax(260px, 350px) minmax(0, 1fr); min-height: 0; }
  #browser { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 16px 10px; }
  #app-menu { display: grid; gap: 4px; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .menu-item { text-align: left; border: 0; padding: 9px 12px; font-size: 13px; background: transparent; }
  .menu-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main.workspace { grid-template-columns: 240px minmax(0, 1fr); }
  #detail { min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 18px 0; }
  .toolbar label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
  .toolbar input, .toolbar select, .target-input { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
  .toolbar input[type=number] { width: 80px; }
  .project-entry { display: grid; gap: 8px; padding-bottom: 16px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .project-entry label { font-size: 12px; font-weight: 600; }
  .project-entry input { width: 100%; min-width: 0; box-sizing: border-box; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  .project-entry p { margin: 0; }
  .primary { color: var(--accent); border-color: var(--accent); padding: 7px 12px; }
  .selection-list { display: grid; gap: 6px; margin: 12px 0 20px; }
  .selection-list label { display: flex; gap: 10px; align-items: start; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-wrap: anywhere; }
  input[type=checkbox] { accent-color: var(--accent); }
  .selection-list small { color: var(--muted); }
  .refresh-box { padding: 14px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; margin: 18px 0; }
  progress { width: 100%; height: 12px; accent-color: var(--accent); margin: 10px 0; }
  #refresh-banner { border-top: 1px solid var(--line); margin-top: 16px; padding: 12px 6px; font-size: 12px; overflow-wrap: anywhere; }
  .status-complete { color: var(--free); }
  .status-failed, .status-partial { color: var(--bad); }
  pre { padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-size: 12px; }
  .docs { max-width: 1000px; }
  .docs p { max-width: 85ch; }
  .role-tag { display: inline-block; padding: 1px 5px; border-radius: 4px; color: var(--accent); background: var(--accent-soft); font: 10px system-ui, sans-serif; margin-left: 4px; }
  .browser-title { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 12px; }
  .browser-title strong { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  #tree { margin-top: 14px; }
  .tree-project { margin: 8px 0 12px; }
  .tree-project summary { cursor: pointer; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; padding: 6px; }
  .tree-button { display: flex; align-items: center; gap: 8px; text-align: left; width: 100%; padding: 7px 10px; border: 0; background: transparent; }
  .tree-button span { flex: 1; overflow-wrap: anywhere; }
  .tree-button small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tree-button.dataset { padding-left: 22px; font-family: var(--mono); font-size: 11px; }
  .tree-button:hover, .tree-button.active { background: var(--accent-soft); color: var(--accent); }
  #scope { padding: 10px 16px 0; font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
  .overview-title { font-family: inherit; font-size: 24px; letter-spacing: -.04em; margin-top: 28px; }
  .eyebrow { color: var(--free); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-top: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; margin-top: 20px; }
  .catalog-card { display: block; text-align: left; padding: 16px; border-radius: 10px; min-width: 0; }
  .catalog-card strong { display: block; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .catalog-card .hint { display: block; margin-top: 8px; }
  .catalog-card p { color: var(--muted); margin: 10px 0 0; font-size: 12px; }
  .breadcrumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 20px 0 0; color: var(--muted); font-size: 12px; }
  .breadcrumbs button { border: 0; background: none; color: var(--accent); padding: 0; overflow-wrap: anywhere; }
  #browser-note { padding: 12px 6px; line-height: 1.6; }
  #results { overflow-y: auto; border-right: 1px solid var(--line); }
  #count { padding: 8px 16px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
  .r { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .r:hover { background: var(--accent-soft); }
  .r.sel { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
  .r .name { font-family: var(--mono); font-size: 13px; word-break: break-all; }
  .r .name b { font-weight: 600; }
  .r .ds { color: var(--muted); }
  .r .meta { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
  .r .cols { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 3px; }
  mark { background: var(--warn-soft); color: inherit; border-radius: 2px; }
  #detail { overflow-y: auto; padding: 0 24px 40px; }  /* no top padding: sticky th pins to the real top */
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  th { z-index: 1; }
  h2 { font-family: var(--mono); font-size: 16px; margin: 20px 0 8px; word-break: break-all; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px;
       display: flex; align-items: center; gap: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; background: var(--panel); }
  .chip.free { color: var(--free); background: var(--free-soft); border-color: transparent; }
  .chip.cost { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .desc { color: var(--muted); margin: 10px 0 0; max-width: 80ch; }
  .chips.labels { margin-top: 6px; }
  .chip.label { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .notes { margin: 12px 0 0; padding: 8px 12px 8px 28px; background: var(--warn-soft); color: var(--ink);
           border-radius: 8px; max-width: 90ch; font-size: 13px; }
  .details { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-size: 13px; }
  .details dt { color: var(--muted); }
  .details dd { margin: 0; font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .tag { font-family: system-ui, sans-serif; font-size: 10px; color: var(--warn); background: var(--warn-soft);
         border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; position: sticky; top: 0; background: var(--bg); }
  td.path { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  td.path .p { color: var(--muted); }
  td.type { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  td.cost { width: 190px; white-space: nowrap; }
  .bar { height: 8px; background: var(--bar); border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: progress; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .scroll table td { white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  textarea { width: 100%; min-height: 90px; font-family: var(--mono); font-size: 12px; padding: 8px; border-radius: 8px;
             border: 1px solid var(--line); background: var(--panel); color: var(--ink); resize: vertical; }
  .est { margin-top: 8px; font-size: 13px; }
  .est .big { font-size: 18px; font-weight: 600; }
  .receipt { margin: 6px 0; font-size: 12px; color: var(--free); }
  .receipt.unconfirmed { color: var(--warn); }
  .receipt code { font-family: var(--mono); font-size: 11px; }
  .report-total { font-size: 18px; font-weight: 600; margin: 12px 0 4px; }
  .err { color: var(--bad); font-size: 12px; white-space: pre-wrap; }
  .hint { color: var(--muted); font-size: 12px; font-weight: 400; text-transform: none; letter-spacing: 0; }
  @media (min-width: 761px) and (max-width: 1100px) {
    main { grid-template-columns: 200px minmax(220px, 30%) minmax(0, 1fr); }
    #detail { padding-left: 16px; padding-right: 16px; }
  }
  @media (max-width: 760px) {
    body { height: auto; min-height: 100%; }
    main { display: block; }
    #browser { max-height: 300px; border-right: 0; border-bottom: 1px solid var(--line); }
    #app-menu { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #results { max-height: 300px; }
    #results { border-right: 0; border-bottom: 1px solid var(--line); }
    #detail { padding: 0 16px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Sounding<span>BigQuery catalog</span></h1>
  <input id="q" type="search" placeholder="Search tables, columns, descriptions…  (/ to focus)" autofocus autocomplete="off">
  <div id="stats"></div>
</header>
<main>
  <nav id="browser" aria-label="Catalog projects and datasets">
    <div id="app-menu" aria-label="Main menu">
      <button class="menu-item active" data-page="catalog">Catalog</button>
      <button class="menu-item" data-page="report">Cost report</button>
      <button class="menu-item" data-page="refresh">Refresh metadata</button>
      <button class="menu-item" data-page="docs">Docs &amp; API</button>
    </div>
    <div id="catalog-browser">
    <form id="open-project-form" class="project-entry">
      <label for="project-id">Open a Google Cloud project</label>
      <input id="project-id" placeholder="Project ID" required autocomplete="off">
      <button id="open-project" class="primary" type="submit">Open &amp; import</button>
      <p class="hint">Imports accessible dataset metadata using existing credentials.</p>
      <div id="project-error" class="err" role="status"></div>
    </form>
    <div class="browser-title"><strong>Catalog</strong><button id="refresh-catalog" title="Reload saved metadata from this computer; does not contact Google Cloud">Reload catalog</button></div>
    <button id="all-tables" class="tree-button active"><span>All projects</span></button>
    <div id="tree" aria-live="polite"></div>
    <p id="browser-note" class="hint">Saved metadata, ready to explore.<br>No sign-in needed to browse.</p>
    </div>
    <div id="refresh-banner" hidden aria-live="polite"></div>
  </nav>
  <section id="results" aria-label="Tables"><div id="scope">All projects</div><div id="count" aria-live="polite"></div><div id="list"></div><button id="more" hidden>Load more</button></section>
  <section id="detail" aria-label="Catalog details"><div class="empty">Loading your catalog…</div></section>
</main>
<script src="/ui.js" defer></script>
</body>
</html>
